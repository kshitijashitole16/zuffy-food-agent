spring.application.name=zuffy-food-agent
server.port=${PORT:8081}
server.address=127.0.0.1

# Local inference only. No OpenAI starter, key, or paid API.
zuffy.model=${OLLAMA_MODEL:llama3.2:3b}
spring.ai.model.chat=ollama
spring.ai.model.embedding=none
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${zuffy.model}
spring.ai.ollama.chat.temperature=0.3
spring.ai.ollama.chat.num-ctx=8192
spring.ai.ollama.chat.num-predict=700
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.retry.max-attempts=1
spring.ai.chat.client.tool-calling.enabled=true

server.error.include-message=never
server.error.include-stacktrace=never
